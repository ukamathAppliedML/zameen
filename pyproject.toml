[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zameen"
version = "0.2.0"
description = "Fine-tune and evaluate language models on ghazal transliteration across Nastaliq, Devanagari and Roman (Rekhta corpus)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Uday Kamath" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU training and evaluation for Qwen and most models
train = [
  "torch>=2.3",
  "transformers>=4.50",
  "peft>=0.13",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
]
# Sarvam-30B: its custom model code needs transformers 4.x (it generates garbage under 5.x)
sarvam = [
  "torch>=2.3",
  "transformers>=4.56,<5",
  "peft>=0.13,<0.18",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
]
hub = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
zameen = "zameen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zameen = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741", "B905"]
per-file-ignores = { "tests/test_importer.py" = ["E501"] }   # lambdas, short loop names like `l` for a line, zip(strict=) is 3.10+ noise here
